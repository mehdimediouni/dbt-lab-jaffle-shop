models:
  - name: stg_jeffle_shop__customers
    description: This model provides a staging layer for customer data, consolidating essential customer information for further analysis and reporting.
    columns:
      - name: customer_id
        description: A unique identifier for each customer.
        data_tests:
          - unique
          - not_null

      - name: first_name
        description: The first name of the customer.
      - name: last_name
        description: The last name of the customer.
  - name: stg_jeffle_shop__orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: status
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - returned
                  - placed
                  - return_pending
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jeffle_shop__customers')
                field: customer_id